<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PartySnap AI — Find Your Party Photos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans">

  <div class="max-w-md mx-auto p-6 space-y-8">
    <!-- Header -->
    <header class="text-center space-y-2 pt-4">
      <h1 class="text-3xl font-extrabold bg-gradient-to-r from-pink-500 to-violet-500 bg-clip-text text-transparent">
        PartySnap AI
      </h1>
      <p class="text-slate-400 text-sm">Scan a quick selfie to get every party photo you're in.</p>
      <p id="eventBadge" class="inline-block text-xs bg-slate-900 border border-slate-800 px-3 py-1 rounded-full text-slate-400"></p>
    </header>

    <!-- Guest Selfie Scanner -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
      <h2 class="text-lg font-semibold">1. Scan Your Face</h2>

      <div class="relative aspect-square w-full bg-slate-800 rounded-xl overflow-hidden flex items-center justify-center">
        <video id="video" autoplay playsinline class="w-full h-full object-cover scale-x-[-1] hidden"></video>
        <img id="selfiePreview" class="w-full h-full object-cover hidden" />
        <canvas id="canvas" class="hidden"></canvas>
        <p id="cameraPlaceholder" class="text-slate-400 text-sm text-center px-4">
          Take a quick selfie to find all your party photos
        </p>
      </div>

      <!-- Native Camera Input (works in TrebEdit & all mobile browsers) -->
      <input id="nativeSelfieInput" type="file" accept="image/*" capture="user" class="hidden" onchange="handleNativeSelfie(event)" />

      <div class="flex flex-col gap-2.5">
        <button onclick="document.getElementById('nativeSelfieInput').click()"
          class="w-full bg-pink-600 hover:bg-pink-500 py-3 rounded-xl font-semibold transition">
          Take Selfie & Find My Pics
        </button>

        <div class="flex gap-2">
          <button id="startCamBtn" onclick="startCamera()"
            class="flex-1 bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-xs font-medium transition">
            Open Live Camera
          </button>
          <button id="scanBtn" onclick="captureAndSearch()" disabled
            class="flex-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 py-2.5 rounded-xl text-xs font-medium transition">
            Snap Live Frame
          </button>
        </div>
      </div>

      <p id="statusText" class="text-center text-sm text-slate-400"></p>
    </section>

    <!-- Matched Photos Gallery -->
    <section id="gallerySection" class="hidden space-y-4">
